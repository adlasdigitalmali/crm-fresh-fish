<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D12">
  <title>Fresh Fish Mali — CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <img class="brand-logo login-logo" src="./logo.png" alt="Logo Fresh Fish Mali">
      <p class="eyebrow">FRESH FISH MALI</p>
      <h1>CRM & Gestion</h1>
      <p class="muted">Connectez-vous pour accéder à votre espace de gestion.</p>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" required placeholder="admin@exemple.com">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe">
      <button class="primary full" type="submit">Se connecter</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </form>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar" id="appSidebar">
      <div class="brand"><img class="brand-logo small" src="./logo.png" alt=""><div><strong>Fresh Fish Mali</strong><small>CRM & Comptabilité</small></div></div>
      <nav id="mainNav">
        <button class="nav-link active" data-page="dashboard">▦ <span>Tableau de bord</span></button>
        <button class="nav-link" data-page="products">♧ <span>Produits & stocks</span></button>
        <button class="nav-link" data-page="stockValue">▤ <span>Stock valorisé</span></button>
        <button class="nav-link" data-page="customers">♙ <span>Clients</span></button>
        <button class="nav-link" data-page="sales">↗ <span>Ventes</span></button>
        <button class="nav-link" data-page="purchases">↙ <span>Achats</span></button>
        <button class="nav-link" data-page="invoices">▤ <span>Factures</span></button>
        <button class="nav-link" data-page="expenses">− <span>Dépenses</span></button>
        <button id="accountingNav" class="nav-link" data-page="accounting">▤ <span>Comptabilité</span></button>
      </nav>
      <div class="sidebar-bottom"><span id="userEmail"></span><button id="logoutBtn" class="logout">Déconnexion</button></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title"><button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button><div><p class="eyebrow">ESPACE DE GESTION</p><h1 id="pageTitle">Tableau de bord</h1></div></div>
        <div class="topbar-meta"><div class="topbar-note"><span class="today-label">Aujourd’hui</span><strong id="todayDate"></strong><span class="currency-chip">FCFA · XOF</span></div><div class="profile-chip"><span class="profile-avatar" aria-hidden="true">FF</span><span><strong>Fresh Fish Mali</strong><small id="topbarUser">Espace sécurisé</small></span></div></div>
      </header>
      <section id="pageContent"></section>
      <div id="appMessage" class="toast" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
